<style>
  :root{--ink:#16181D;--muted:#6E7681;--rule:#E2E5E8;--paper:#F5F6F7;--red:#A32B3B;--amber:#8A6410}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;
       -webkit-text-size-adjust:100%;padding-env:0}
  .wrap{max-width:940px;margin:0 auto;padding:24px 16px calc(80px + env(safe-area-inset-bottom))}
  .fr{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}
  h1{margin:0;font-size:30px}
  button,input{font-family:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;
         padding-bottom:18px;border-bottom:1px solid var(--rule)}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:480px;line-height:1.45}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);
         border:1px solid var(--rule);margin-top:22px}
  .stat{background:#fff;padding:16px 16px 14px}
  .stat.hot{background:#FDF3F4}
  .stat b{display:block;font-size:34px;line-height:1}
  .stat.hot b{color:var(--red)}
  .stat span{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.35}
  .bars{margin-top:20px;display:flex;flex-wrap:wrap;gap:18px}
  .bar{flex:1 1 150px;min-width:150px}
  .bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .bar .lab b{font-weight:600}
  .bar .track{height:4px;background:var(--rule)}
  .bar .fill{height:100%}
  .chips{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{border:1px solid var(--rule);background:#fff;padding:5px 11px;font-size:13px;border-radius:2px}
  .chip[aria-pressed="true"]{color:#fff}
  .linkish{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
  #q{margin-left:auto;border:1px solid var(--rule);padding:6px 10px;font-size:13px;min-width:150px;
     border-radius:2px;background:#fff}
  .tabs{margin-top:12px;display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--rule)}
  .tab{border:none;background:none;padding:9px 12px;font-size:13.5px;color:var(--muted);
       border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .tab i{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
  .blurb{margin:16px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5;max-width:620px}
  .daygroup{margin-top:26px}
  .dayhead{display:flex;align-items:baseline;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
  .dayhead b{font-size:14px}
  .dayhead span{font-size:12.5px;color:var(--muted)}
  .dayhead span.past{color:var(--red)}
  .row{display:flex;gap:12px;padding:11px 6px 11px 12px;border-bottom:1px solid var(--rule);
       border-left:3px solid var(--rule);background:#fff;align-items:flex-start}
  .row input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px;flex:none;margin-top:2px}
  .row .body{flex:1;min-width:0}
  .row .top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
  .row .cls{font-size:12px;font-weight:600}
  .row .ttl{font-size:14.5px}
  .row.done .ttl{text-decoration:line-through;color:var(--muted)}
  .row .note{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
  .row .when{text-align:right;flex:none;font-size:12.5px;color:var(--muted);line-height:1.5}
  .row .when .d{color:var(--ink)}
  .row.done .when .d{color:var(--muted)}
  .status{font-size:12.5px;margin-top:4px;font-weight:500}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--rule);padding:1px 6px;border-radius:2px;white-space:nowrap}
  .tag.strong{color:var(--ink);border-color:#C9CDD2;background:#EDEFF2}
  .empty{padding:48px 4px;color:var(--muted);font-size:14.5px;line-height:1.5}
  .donebar{width:100%;text-align:left;border:none;background:none;font-size:13.5px;color:var(--muted);
           padding:9px 2px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;margin-top:38px}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;
         gap:16px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .syncline{display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:#1B7A5A}.dot.busy{background:var(--amber)}.dot.bad{background:var(--red)}
  .setup{background:#FFF8E6;border:1px solid #E8D9A8;padding:12px 14px;margin-top:22px;font-size:13.5px;line-height:1.5}
  .setup code{background:#fff;border:1px solid var(--rule);padding:1px 5px;font-size:12.5px}
  @media (max-width:560px){
    h1{font-size:25px}.stat b{font-size:28px}.wrap{padding:18px 13px 80px}
    #q{margin-left:0;width:100%}.row .when{font-size:12px}
  }
  @media (prefers-reduced-motion:no-preference){.row{transition:background .12s ease}}
  @media (hover:hover){.row:hover{background:#FAFBFC}}
</style>
</head>

"locked":true,"points":null,"time":null,"note":"Runs across two class days."},{"id":"mkt-321-visual-retail-xc-5","cls":"MKT 321","title":"Visual Retail XC 5","type":"xc","buffer":"2026-12-01","real":"2026-12-03","locked":false,"points":null,"time":null,"note":"Last of the five extra credit submissions."},{"id":"iba-455-final-all","cls":"IBA 455","title":"FINAL ALL \u2014 final exam","type":"exam","buffer":"2026-12-05","real":"2026-12-07","locked":true,"points":null,"time":"10:30 am","note":"Final exam at 10:30 am."},{"id":"bsc-108-exam-iii","cls":"BSC 108","title":"Exam III \u2014 modules 9\u201312","type":"exam","buffer":"2026-12-06","real":"2026-12-08","locked":true,"points":null,"time":null,"note":"Respondus LockDown required. Window closes 11:59 pm CST."},{"id":"iba-455-p8","cls":"IBA 455","title":"P8","type":"work","buffer":"2026-12-06","real":"2026-12-08","locked":false,"points":null,"time":null,"note":"Final P-marker. Falls the day after the IBA 455 final."},{"id":"mkt-321-cumulative-final-exam","cls":"MKT 321","title":"Cumulative final exam","type":"exam","buffer":"2026-12-07","real":"2026-12-09","locked":true,"points":null,"time":"1:30 pm","note":"Covers the whole semester. 1:30 pm."},{"id":"iba-460-test-3---final-exam","cls":"IBA 460","title":"Test 3 / final exam","type":"exam","buffer":"2026-12-08","real":"2026-12-10","locked":true,"points":null,"time":"1:30 pm","note":"Mandatory. 1:30 pm."}];

const CLASSES = {
  'IBA 455':'#2E5FA3','IBA 460':'#6B4FA0','BSC 108':'#1B7A5A','MKT 321':'#B03A48','GBA 346':'#B07209'
};
const TABS = [['attention','Needs attention'],['open','Open'],['exams','Exams'],['xc','Extra credit'],['done','Done'],['all','Everything']];
const BLURB = {
  exams:'Every test and final, in order. These dates cannot move \u2014 a check mark here means you studied, not that you submitted something.',
  xc:'Five optional Visual Retail submissions in MKT 321. These do not count against your completion percentage.'
};
const LS_KEY = 'fall26-state-v2';
const LS_OLD = 'ua-fall26-tracker';

const d = iso => new Date(iso + 'T12:00:00');
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); };
const days = (a,b) => Math.round((a-b)/86400000);
const fmt = iso => d(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtShort = iso => d(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

// ─── State: per item { done, at } so two devices merge by whichever is newer ──
let state = { items: {} };
let view = 'attention', classFilter = [], query = '', showDone = false;
let pushTimer = null, dirty = false;

function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { state = JSON.parse(raw); return; }
    const old = localStorage.getItem(LS_OLD);       // migrate the artifact's format
    if (old) {
      const o = JSON.parse(old).done || {};
      state = { items: Object.fromEntries(Object.entries(o).map(([k,v]) => [k,{done:true,at:v}])) };
      saveLocal();
    }
  } catch(e){ state = { items:{} }; }
  if (!state.items) state.items = {};
}
const saveLocal = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} };

function merge(a, b){
  const out = { items: {} };
  const ids = new Set([...Object.keys(a.items||{}), ...Object.keys(b.items||{})]);
  ids.forEach(id => {
    const x = (a.items||{})[id], y = (b.items||{})[id];
    if (!x) { out.items[id] = y; return; }
    if (!y) { out.items[id] = x; return; }
    out.items[id] = (new Date(y.at) > new Date(x.at)) ? y : x;
  });
  return out;
}
const isDone = id => !!(state.items[id] && state.items[id].done);

// ─── Sync ────────────────────────────────────────────────────────────────────
function setSync(kind, msg){
  document.getElementById('dot').className = 'dot ' + kind;
  document.getElementById('syncmsg').textContent = msg;
}
function askKey(note){
  const el = document.getElementById('setup');
  el.hidden = false;
  el.innerHTML = (note ? '<b>' + note + '</b><br>' : '') +
    'Type your sync key to sync check marks between your devices. You only do this once on each device. ' +
    '<br><input id="synckey" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
    'placeholder="XXXXX-XXXXX-XXXXX-XXXXX" style="font:inherit;padding:6px 8px;margin:8px 6px 0 0;width:15em"> ' +
    '<button class="chip" id="savekey">Save</button>';
  setSync('', 'Sync key needed');
  document.getElementById('savekey').onclick = () => {
    const v = normaliseKey(document.getElementById('synckey').value);
    if (v.length < 16) return;
    try { localStorage.setItem(KEY_LS, v); } catch(e){}
    el.hidden = true; el.innerHTML = '';
    pull();
  };
}
function keyRefused(){
  try { localStorage.removeItem(KEY_LS); } catch(e){}
  askKey('That sync key did not work. Check it and type it again.');
}
async function pull(){
  if (!SYNC_URL) return;
  if (!syncKey()) { askKey(); return; }
  setSync('busy','Checking for updates');
  try {
    const r = await fetch(SYNC_URL, { cache:'no-store', headers: authHeaders() });
    if (r.status === 401) { keyRefused(); return; }
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    const before = JSON.stringify(state);
    state = merge(state, remote && remote.items ? remote : {items:{}});
    saveLocal(); render();
    if (JSON.stringify(state) !== JSON.stringify(remote)) await push(true);
    else setSync('ok', 'Synced ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
    if (before !== JSON.stringify(state)) setSync('ok','Updated from your other device');
  } catch(e){
    setSync('bad', navigator.onLine ? 'Sync unreachable — saved on this device' : 'Offline — saved on this device');
  }
}
async function push(quiet){
  if (!SYNC_URL) return;
  if (!syncKey()) { askKey(); return; }
  if (!quiet) setSync('busy','Saving');
  try {
    const r = await fetch(SYNC_URL, { method:'PUT', headers: authHeaders({'Content-Type':'application/json'}),
                                      body: JSON.stringify(state) });
    if (r.status === 401) { dirty = true; keyRefused(); return; }
    if (r.status === 409) { dirty = true; setSync('bad', 'Not saved: that would clear most check marks'); return; }
    if (!r.ok) throw new Error(r.status);
    dirty = false;
    setSync('ok','Synced ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
  } catch(e){
    dirty = true;
    setSync('bad', navigator.onLine ? 'Could not save to the cloud — kept on this device' : 'Offline — saved on this device');
  }
}
const schedulePush = () => { clearTimeout(pushTimer); pushTimer = setTimeout(() => push(false), 600); };

function toggle(id){
  const now = new Date().toISOString();
  state.items[id] = { done: !isDone(id), at: now };
  saveLocal(); render(); schedulePush();
}

// ─── Derived ─────────────────────────────────────────────────────────────────
function statusOf(i){
  if (isDone(i.id)) return 'done';
  const t = today(), r = d(i.real);
  if (r < t) return 'late';
  if (+r === +t) return 'today';
  return 'upcoming';
}
function visible(){
  let r = DATA.map(i => ({...i, status: statusOf(i)}));
  if (view === 'exams') r = r.filter(i => i.type === 'exam');
  else if (view === 'xc') r = r.filter(i => i.type === 'xc');
  else if (view === 'open') r = r.filter(i => i.status !== 'done');
  else if (view === 'done') r = r.filter(i => i.status === 'done');
  else if (view === 'attention') r = r.filter(i => i.status !== 'done' && days(d(i.real), today()) <= 3);
  if (classFilter.length) r = r.filter(i => classFilter.includes(i.cls));
  if (query.trim()){
    const s = query.toLowerCase();
    r = r.filter(i => (i.title+' '+i.cls+' '+(i.note||'')).toLowerCase().includes(s));
  }
  return r;
}
function groupBy(list){
  const m = new Map();
  list.forEach(i => { if(!m.has(i.real)) m.set(i.real,[]); m.get(i.real).push(i); });
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0]));
}

// ─── Render ──────────────────────────────────────────────────────────────────
function statusLine(i){
  const n = days(d(i.real), today()), held = i.locked;
  if (n < 0)  return `<div class="status" style="color:var(--red)">${held?'Held':'Deadline passed'} ${plural(-n,'day')} ago</div>`;
  if (n === 0) return `<div class="status" style="color:var(--red)">${held?'Held today':'Due today'}</div>`;
  if (n <= 7)  return `<div class="status" style="color:${n<=2?'var(--amber)':'var(--muted)'}">${held?'Held':'Due'} in ${plural(n,'day')}</div>`;
  return '';
}
function rowHTML(i){
  const c = CLASSES[i.cls], done = i.status === 'done';
  const tags = [
    i.type==='xc' ? '<span class="tag">extra credit</span>' : '',
    i.type==='exam' ? '<span class="tag strong">exam</span>' : '',
    i.type==='inclass' ? '<span class="tag">in class</span>' : '',
    i.points ? `<span class="tag">${i.points} pts</span>` : ''
  ].join('');
  return `<div class="row${done?' done':''}" style="border-left-color:${c}">
    <input type="checkbox" ${done?'checked':''} data-id="${i.id}"
      aria-label="Mark ${esc(i.cls)} ${esc(i.title)} complete">
    <div class="body">
      <div class="top"><span class="cls" style="color:${c}">${i.cls}</span>
        <span class="ttl">${esc(i.title)}</span>${tags}</div>
      ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
      ${done ? '' : statusLine(i)}
    </div>
    <div class="when"><div class="d">${i.locked?'held':'due'} ${fmtShort(i.real)}</div>
      ${i.time?`<div>${esc(i.time)}</div>`:''}</div>
  </div>`;
}
function groupsHTML(groups){
  return groups.map(([date, list]) => {
    const n = days(d(date), today());
    const rel = n===0?'today':n===1?'tomorrow':n<0?`${plural(-n,'day')} ago`:`in ${plural(n,'day')}`;
    return `<div class="daygroup"><div class="dayhead"><b>${fmt(date)}</b>
      <span class="${n<0?'past':''}">${rel}</span></div>${list.map(rowHTML).join('')}</div>`;
  }).join('');
}

function render(){
  const all = DATA.map(i => ({...i, status: statusOf(i)}));
  const t = today();
  const graded = all.filter(i => i.type !== 'xc');
  const open = all.filter(i => i.status !== 'done');
  const s = {
    late: open.filter(i => i.status==='late').length,
    today: open.filter(i => i.status==='today').length,
    week: open.filter(i => { const n = days(d(i.real), t); return n>=0 && n<=7; }).length,
    openTotal: open.filter(i => i.type!=='xc').length,
    doneCount: graded.filter(i => i.status==='done').length,
    total: graded.length,
    xcDone: all.filter(i => i.type==='xc' && i.status==='done').length,
    xcTotal: all.filter(i => i.type==='xc').length,
    examsLeft: all.filter(i => i.type==='exam' && i.status!=='done').length,
    ptsDone: all.filter(i => i.points && i.status==='done').reduce((a,i)=>a+i.points,0),
    ptsTotal: all.filter(i => i.points).reduce((a,i)=>a+i.points,0)
  };

  document.getElementById('pct').textContent = (s.total ? Math.round(s.doneCount/s.total*100) : 0) + '%';
  document.getElementById('pctsub').textContent = `${s.doneCount} of ${s.total} done`;

  document.getElementById('stats').innerHTML = [
    [s.late, s.late===1?'deadline missed':'deadlines missed', s.late>0],
    [s.today, 'due today', s.today>0],
    [s.week, 'due within 7 days', false],
    [s.openTotal, 'still open this semester', false]
  ].map(([n,l,hot]) => `<div class="stat${hot?' hot':''}"><b class="fr">${n}</b><span>${l}</span></div>`).join('');

  document.getElementById('bars').innerHTML = Object.keys(CLASSES).map(c => {
    const a = all.filter(i => i.cls===c && i.type!=='xc');
    const dn = a.filter(i => i.status==='done').length;
    return `<div class="bar"><div class="lab"><b style="color:${CLASSES[c]}">${c}</b>
      <span style="color:var(--muted)">${dn}/${a.length}</span></div>
      <div class="track"><div class="fill" style="width:${a.length?dn/a.length*100:0}%;background:${CLASSES[c]}"></div></div></div>`;
  }).join('');

  document.getElementById('chips').innerHTML =
    Object.keys(CLASSES).map(c => {
      const on = classFilter.includes(c);
      return `<button class="chip" data-cls="${c}" aria-pressed="${on}"
        style="${on?`background:${CLASSES[c]};border-color:${CLASSES[c]}`:''}">${c}</button>`;
    }).join('') +
    (classFilter.length ? '<button class="linkish" id="clearcls">show all</button>' : '') +
    `<input id="q" placeholder="Search assignments" value="${esc(query)}">`;

  document.getElementById('tabs').innerHTML = TABS.map(([k,l]) => {
    const badge = k==='exams' ? ` <i>${s.examsLeft}</i>` : k==='xc' ? ` <i>${s.xcDone}/${s.xcTotal}</i>` : '';
    return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${view===k}">${l}${badge}</button>`;
  }).join('');

  const blurb = document.getElementById('blurb');
  if (BLURB[view]) { blurb.textContent = BLURB[view]; blurb.hidden = false; } else blurb.hidden = true;

  const shown = visible();
  const split = view !== 'done';
  const openItems = split ? shown.filter(i => i.status!=='done') : shown;
  const doneItems = split ? shown.filter(i => i.status==='done') : [];
  let html = '';
  if (!openItems.length){
    html += `<div class="empty">` + (
      doneItems.length ? `Everything here is checked off — all ${doneItems.length} of them. They are tucked below.`
      : view==='attention' ? 'Nothing is late and nothing is due in the next three days. Check the Open tab to work ahead.'
      : view==='done' ? 'Nothing checked off yet. Tick something on the Open tab and it will land here.'
      : 'No assignments match these filters. Try clearing the search or showing all classes.'
    ) + `</div>`;
  }
  html += groupsHTML(groupBy(openItems));
  if (doneItems.length){
    html += `<button class="donebar" id="donebar" aria-expanded="${showDone}">
      <span style="font-size:10px">${showDone?'\u25BE':'\u25B8'}</span> Completed (${doneItems.length})
      ${showDone?'':'<span style="font-size:12.5px">— hidden so the next one is always on top</span>'}</button>`;
    if (showDone) html += groupsHTML(groupBy(doneItems));
  }
  document.getElementById('list').innerHTML = html;

  document.getElementById('tally').textContent =
    `Extra credit ${s.xcDone}/${s.xcTotal} · GBA 346 points ${s.ptsDone}/${s.ptsTotal}`;
}

// ─── Events (delegated, so re-rendering never loses handlers) ────────────────
document.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox][data-id]')) toggle(e.target.dataset.id);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){
    query = e.target.value; render();
    const box = document.getElementById('q');
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
  }
});
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ view = tab.dataset.tab; showDone = false; render(); return; }
  const chip = e.target.closest('[data-cls]');
  if (chip){
    const c = chip.dataset.cls;
    classFilter = classFilter.includes(c) ? classFilter.filter(x=>x!==c) : classFilter.concat(c);
    render(); return;
  }
  if (e.target.id === 'clearcls'){ classFilter = []; render(); return; }
  if (e.target.closest('#donebar')){ showDone = !showDone; render(); return; }
  if (e.target.id === 'keybtn'){ askKey(); return; }
  if (e.target.id === 'reset'){
    if (confirm('Clear every check mark on every device? This cannot be undone.')){
      const now = new Date().toISOString();
      Object.keys(state.items).forEach(id => { state.items[id] = { done:false, at:now }; });
      saveLocal(); render(); push(false);
    }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', () => { if (dirty) push(false); else pull(); });

// ─── Boot ────────────────────────────────────────────────────────────────────
loadLocal();
render();
if (!SYNC_URL){
  const el = document.getElementById('setup');
  el.hidden = false;
  el.innerHTML = 'Sync is not turned on yet, so check marks stay on this device only. ' +
    'Open <code>index.html</code>, paste your Worker URL into <code>SYNC_URL</code> near the top of the script, and redeploy.';
  setSync('', 'Local only — sync not set up');
} else if (!syncKey()) {
  askKey();
} else {
  pull();
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
